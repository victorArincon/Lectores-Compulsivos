{% extends "base.html" %}

{% block title %}Crear Usuario{% endblock %}
{% block heading %}Registrar Nuevo Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-secondary-subtle">
            <div class="card-body p-4">
                
                {% if mensaje %}
                <div class="alert alert-{{ mensaje.tipo }}">{{ mensaje.texto }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('crear_usuario') }}">
                    <div class="mb-3">
                        <label class="form-label">Usuario (ID para iniciar sesión)</label>
                        <input type="text" name="username" class="form-control" placeholder="Ej: vito123" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ej: Víctor" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Contraseña segura" required>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="isAdmin" name="is_admin">
                        <label class="form-check-label text-warning" for="isAdmin">
                            ¿Es Administrador? (Tendrá privilegios para crear a otros)
                        </label>
                    </div>
                    
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('catalogo') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Registrar Usuario</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
