<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lectores Compulsivos - Solicitud de Registro</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="form-signin w-100 m-auto" style="max-width: 380px; padding: 15px;">
        <form method="POST">
            <h1 class="h3 mb-3 fw-normal text-center">Solicitud de Registro</h1>

            {% if mensaje %}
            <div class="alert alert-{{ mensaje.tipo }}" role="alert">
                {{ mensaje.texto }}
            </div>
            {% endif %}

            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="username" name="username" placeholder="Usuario ID" required>
                <label for="username">Usuario (ID para iniciar sesión)</label>
            </div>
            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre completo" required>
                <label for="nombre">Nombre Completo</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                <label for="password">Contraseña</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary mb-2" type="submit">Enviar Solicitud</button>
            <a href="{{ url_for('login') }}" class="w-100 btn btn-lg btn-outline-secondary">Volver al Login</a>
        </form>
    </main>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
