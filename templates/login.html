<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lectores Compulsivos - Iniciar Sesión</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
    <style>
        body.login-background {
            /* Imagen de fondo */
            background-image: url('https://plus.unsplash.com/premium_photo-1677567996070-68fa4181775a?q=80&w=2072&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            position: relative;
        }

        /* Blur*/
        body.login-background::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 1;
        }

        /* Asegurar que la caja del formulario esté por encima del fondo */
        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(33, 37, 41, 0.85);
            backdrop-filter: blur(1px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 4px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="d-flex align-items-center py-4 login-background">
    <main class="form-signin w-100 m-auto" style="max-width: 380px; padding: 15px;">
        <div class="login-card p-4 p-md-5">
            <form method="POST">
                <h1 class="h3 mb-4 fw-normal text-center">Lectores Compulsivos</h1>

                {% if error %}
                <div class="alert alert-danger py-2 small" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <div class="form-floating mb-3">
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="usuario" name="usuario" placeholder="Usuario" required>
                    <label for="usuario" class="text-secondary">Usuario</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" placeholder="Contraseña" required>
                    <label for="password" class="text-secondary">Contraseña</label>
                </div>

                <button class="w-100 btn btn-lg btn-primary mb-2 shadow-sm" type="submit">Iniciar Sesión</button>
                <a href="{{ url_for('registro') }}" class="w-100 btn btn-lg btn-outline-light">Registrarse</a>
            </form>
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
